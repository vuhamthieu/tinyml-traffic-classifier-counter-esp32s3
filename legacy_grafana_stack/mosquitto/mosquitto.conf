# Mosquitto MQTT broker configuration
# docker/mosquitto/mosquitto.conf

# ── Listeners ────────────────────────────────────────────────────────────────
# Standard MQTT (ESP32-S3 uses this)
listener 1883
protocol mqtt

# WebSocket (Node-RED, browser clients)
listener 9001
protocol websockets

# ── Authentication ────────────────────────────────────────────────────────────
# Allow anonymous connections for local development.
# For production: set allow_anonymous false and add a password file.
allow_anonymous true

# Uncomment for password-protected access:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# ── Persistence ───────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
