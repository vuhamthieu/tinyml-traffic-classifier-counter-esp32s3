services:

  influxdb:
    image: influxdb:2
    container_name: traffic_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE:     setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: traffic2026
      DOCKER_INFLUXDB_INIT_ORG:      traffic_org
      DOCKER_INFLUXDB_INIT_BUCKET:   vehicle_counts
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: traffic-super-secret-token
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegraf:
    image: telegraf:latest
    container_name: traffic_telegraf
    restart: unless-stopped
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      HIVEMQ_HOST:     ${HIVEMQ_HOST}
      HIVEMQ_USER:     ${HIVEMQ_USER}
      HIVEMQ_PASSWORD: ${HIVEMQ_PASSWORD}

  grafana:
    image: grafana/grafana:latest
    container_name: traffic_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: traffic2026
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/traffic.json

volumes:
  influxdb_data:
  grafana_data:
